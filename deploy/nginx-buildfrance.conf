# Nginx reverse proxy for Build France - Devis & Factures
# Replace devis.example.com with your domain, then:
#   sudo cp deploy/nginx-buildfrance.conf /etc/nginx/sites-available/buildfrance
#   sudo ln -s /etc/nginx/sites-available/buildfrance /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d devis.example.com      (adds HTTPS + redirect automatically)

server {
    listen 80;
    listen [::]:80;
    server_name devis.example.com;

    # Backups (.json) and logos can be a few MB
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

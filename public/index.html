<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Build France - Devis & Factures</title>
  <link rel="icon" href="/assets/logo-header.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/doc.css">
</head>
<body>
  <a class="skip" href="#main">Aller au contenu</a>

  <header class="hd">
    <div class="wrap hd-in">
      <a href="#/" class="brand" aria-label="Accueil Build France">
        <img src="/assets/logo-header.png" alt="Build France SAS">
        <span class="brand-txt">
          <strong>Devis &amp; Factures</strong>
          <span>Espace de gestion interne</span>
        </span>
      </a>
      <div class="hd-actions">
        <a class="btn btn-secondary" href="#/nouveau/facture">Nouvelle facture</a>
        <a class="btn" href="#/nouveau/devis"><span aria-hidden="true">+</span> Nouveau devis</a>
      </div>
      <button class="menu-btn" type="button" id="menu-btn" aria-expanded="false" aria-controls="nav">
        <span class="menu-ico" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="menu-lbl">Menu</span>
      </button>
    </div>
    <nav class="nav" id="nav" aria-label="Menu principal">
      <div class="wrap nav-in">
        <a data-nav="home" href="#/">Accueil</a>
        <a data-nav="devis" href="#/devis">Devis</a>
        <a data-nav="facture" href="#/factures">Factures</a>
        <a data-nav="clients" href="#/clients">Clients</a>
        <a data-nav="parametres" href="#/parametres">Paramètres</a>
        <div class="nav-cta">
          <a class="btn" href="#/nouveau/devis">+ Nouveau devis</a>
          <a class="btn btn-secondary" href="#/nouveau/facture">+ Nouvelle facture</a>
        </div>
      </div>
    </nav>
  </header>

  <main id="main" class="wrap" tabindex="-1"></main>

  <footer class="ft">
    <div class="wrap ft-in">
      <span>Build France SAS - 6 impasse Jean Macé, 30900 Nîmes</span>
      <span id="ft-user"></span>
    </div>
  </footer>

  <div id="print-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="dlg"></dialog>

  <script src="/js/logo.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/templates.js"></script>
  <script src="/js/app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" defer></script>
</body>
</html>
